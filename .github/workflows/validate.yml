name: validate

on:
  push:
    branches: 
    - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: vet
      run: go vet ./...
      
    - name: test
      run: go test -v ./... -race -covermode=atomic -coverprofile=coverage.out

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
