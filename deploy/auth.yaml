apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: scale-cluster
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: scale-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scale-cluster
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
