apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: sts-role
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: sts-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sts-role
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
