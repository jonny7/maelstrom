apiVersion: v1
kind: Service
metadata:
  name: maelstrom-svc
spec:
  clusterIP: None
  selector:
    app: maelstrom
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: 7373
      targetPort: 7373
    - name: serf-tcp
      protocol: TCP
      port: 7946
      targetPort: 7946
    - name: serf-udp
      protocol: UDP
      port: 7946
      targetPort: 7946
---
apiVersion: v1
kind: Service
metadata:
  name: maelstrom-svc-ext
spec:
  type: NodePort
  selector:
    app: maelstrom
  ports:
    - name: api
      port: 3000
      targetPort: 3000
    - name: ui
      port: 4000
      targetPort: 4000
