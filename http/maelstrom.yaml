openapi: "3.0.0"
info:
  version: 0.0.1
  title: Maelstrom members
  description: |
    open-api spec for Maelstrom
servers:
  - url: https://{hostname}/api
    variables:
      hostname:
        default: 0.0.0.0
paths:
  /nodes:
    get:
      operationId: nodes
      responses:
        '200':
          description: | 
            get the current set of maelstrom nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthz:
    get:
      operationId: health
      responses:
        '204':
          description: |
            kubernetes healthchecks
        default:
          description: error obtaining health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /scale:
    post:
      operationId: scale
      requestBody:
        description: |
          scale the number of nodes through K8s API
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scale'
      responses:
        '204':
          description: |
            kubernetes healthchecks
        default:
          description: error obtaining health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /start:
    post:
      operationId: start
      requestBody:
        description: |
         start the load test
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bool'
      responses:
        '200':
          description: |
           acknowledge the test started
        default:
          description: error trying to start load test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Node:
      type: object
      properties:
        Name:
          type: string
        Addr:
          type: string
        Port:
          type: integer
        Tags:
          type: array
    Scale:
      type: object
      required: [numberOfWorkers]
      properties:
        number_of_workers:
          type: integer
    Bool:
      type: object
      properties:
        success:
          type: boolean
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
